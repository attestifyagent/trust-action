name: Self-test
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  checks: write

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        id: trust
        with:
          api-key: ${{ secrets.TRUST_API_KEY }}
          agent-id: ${{ secrets.TRUST_AGENT_ID }}
          private-key: ${{ secrets.TRUST_PRIVATE_KEY }}
      - run: |
          echo "Receipt: ${{ steps.trust.outputs.receipt-id }}"
          echo "Verify:  ${{ steps.trust.outputs.receipt-url }}"
          echo "Level:   ${{ steps.trust.outputs.assurance-level }}"
